name: web

on:
  push:
    branches: [master, staging]
    paths: ["apps/web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["apps/web/**", ".github/workflows/web.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # Speed check: the sign-in page (static, no database needed) must stay fast.
      - name: Speed check (Lighthouse)
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/login >/dev/null && break; sleep 1; done
          npx --yes @lhci/cli@0.16.0 autorun
        env:
          NEXT_TELEMETRY_DISABLED: "1"
