name: contest

on:
  push:
    branches: [master, staging]
    paths: ["modules/contest/backend/**", ".github/workflows/contest.yml"]
  pull_request:
    paths: ["modules/contest/backend/**", ".github/workflows/contest.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: contest_ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: modules/contest/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modules/contest/backend/pyproject.toml
      - run: pip install -e ".[dev,prod]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Security audit (pip-audit)
        run: pip-audit --skip-editable
      - name: Migrations apply and the app starts
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/contest_ci
        run: |
          python -m app.cli init-db
          python -c "from app.api.app import create_app; create_app()"
      - name: Docker image builds
        run: docker build -t contest-ci .
