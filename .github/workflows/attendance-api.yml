name: attendance-api

on:
  push:
    branches: [master, staging]
    paths: ["services/attendance-api/**", ".github/workflows/attendance-api.yml"]
  pull_request:
    paths: ["services/attendance-api/**", ".github/workflows/attendance-api.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/attendance-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/attendance-api/go.mod
          cache-dependency-path: services/attendance-api/go.sum
      - name: Every migration has a down file
        run: |
          for up in migrations/*.up.sql; do
            [ -f "${up%.up.sql}.down.sql" ] || { echo "missing down for $up"; exit 1; }
          done
      - run: go vet ./...
      - run: go build ./...
